name: Bug report
description: Report a reproducible ATIV defect
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove private file paths and media from logs before posting.
  - type: input
    id: version
    attributes:
      label: ATIV version
      placeholder: 0.2.4
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS (ARM64), macOS (x64), Windows (x64), Windows (ARM64), Linux (x64), Linux (ARM64)]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
