name: Native build, test, and package

on:
  workflow_dispatch:
    inputs:
      sign_macos:
        description: Sign and notarize macOS validation artifacts (does not publish a release)
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ATIV_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || 'development' }}
  ATIV_UPDATE_PUBLIC_KEY: ${{ vars.ATIV_UPDATE_PUBLIC_KEY }}
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  engine:
    defaults:
      run:
        working-directory: ATIV
    name: Shared Rust engine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ATIV
      - name: Check out the tested canonical media core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tlolabs/avid-core
          ref: 0cce6ba838827d0bed540efc98731e74a1014456
          persist-credentials: false
          path: AVID Core
      - name: Configure build identity
        shell: bash
        run: |
          base="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$ATIV_CHANNEL" == stable ]]; then
            test "$GITHUB_REF_NAME" = "v$base"
            echo "ATIV_VERSION=$base" >> "$GITHUB_ENV"
            echo "ATIV_RELEASE=1" >> "$GITHUB_ENV"
          else
            echo "ATIV_VERSION=$base-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi
      - name: Fetch the same approved tools used by Linux packaging
        run: |
          ./script/fetch_ffmpeg.sh linux x86_64 build/ffmpeg-linux-x86_64
          echo "$PWD/build/ffmpeg-linux-x86_64" >> "$GITHUB_PATH"
      - name: Validate release infrastructure
        run: |
          python3 -m venv build/release-tools
          build/release-tools/bin/pip install -r script/requirements-build.txt
          build/release-tools/bin/python script/test_release_infrastructure.py
      - name: Validate Rust workspace
        run: |
          rustup component add rustfmt clippy
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --workspace --locked --all-targets
      - name: Verify executable protocol and a real encode
        run: ./script/test_engine_integration.sh

  macos:
    defaults:
      run:
        working-directory: ATIV
    name: macOS ${{ matrix.arch }}
    needs: engine
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            fetch_arch: aarch64
            runner: macos-15
          - arch: x86_64
            fetch_arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ATIV
      - name: Check out the tested canonical media core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tlolabs/avid-core
          ref: 0cce6ba838827d0bed540efc98731e74a1014456
          persist-credentials: false
          path: AVID Core
      - name: Configure build identity
        shell: bash
        run: |
          base="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$ATIV_CHANNEL" == stable ]]; then
            test "$GITHUB_REF_NAME" = "v$base"
            echo "ATIV_VERSION=$base" >> "$GITHUB_ENV"
            echo "ATIV_RELEASE=1" >> "$GITHUB_ENV"
          else
            echo "ATIV_VERSION=$base-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi
      - name: Fetch verified static FFmpeg 9.0.1
        run: ./script/fetch_ffmpeg.sh macos "${{ matrix.fetch_arch }}" "build/ffmpeg-macos-${{ matrix.arch }}"
      - name: Configure release signing and notarization
        if: startsWith(github.ref, 'refs/tags/') || inputs.sign_macos
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          : "${CERTIFICATE_BASE64:?Missing MACOS_CERTIFICATE_BASE64}"
          : "${CERTIFICATE_PASSWORD:?Missing MACOS_CERTIFICATE_PASSWORD}"
          : "${NOTARY_APPLE_ID:?Missing MACOS_NOTARY_APPLE_ID}"
          : "${NOTARY_PASSWORD:?Missing MACOS_NOTARY_PASSWORD}"
          : "${NOTARY_TEAM_ID:?Missing MACOS_NOTARY_TEAM_ID}"
          : "${SIGNING_IDENTITY:?Missing MACOS_SIGNING_IDENTITY}"
          KEYCHAIN="${RUNNER_TEMP}/ativ-signing.keychain-db"
          CERTIFICATE="${RUNNER_TEMP}/ativ-signing.p12"
          printf '%s' "${CERTIFICATE_BASE64}" | base64 -D > "${CERTIFICATE}"
          security create-keychain -p "${CERTIFICATE_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${CERTIFICATE_PASSWORD}" "${KEYCHAIN}"
          security import "${CERTIFICATE}" -P "${CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${CERTIFICATE_PASSWORD}" "${KEYCHAIN}"
          security list-keychains -d user -s "${KEYCHAIN}"
          xcrun notarytool store-credentials ativ-notary --apple-id "${NOTARY_APPLE_ID}" --team-id "${NOTARY_TEAM_ID}" --password "${NOTARY_PASSWORD}"
      - name: Verify canonical media and host contract with release tools
        shell: bash
        run: |
          export PATH="$PWD/build/ffmpeg-macos-${{ matrix.arch }}:$PATH"
          cargo test --locked --all-targets
          cargo test --manifest-path "../AVID Core/Cargo.toml" --locked --all-targets
          cargo test --manifest-path "../AVID Core/Cargo.toml" --locked --test ffmpeg -- --ignored
          ./script/test_engine_integration.sh
      - name: Native process integration tests
        run: |
          python3 script/create_smoke_media.py build/native-fixtures
          PATH="$PWD/build/ffmpeg-macos-${{ matrix.arch }}:$PATH" ATIV_TEST_MEDIA="$PWD/build/native-fixtures" ATIV_ENGINE_PATH="$PWD/target/debug/ativ-engine" swift test --package-path platform/macos --scratch-path build/native-tests
      - name: Build and package native application
        env:
          APPLE_SIGN_IDENTITY: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.sign_macos) && secrets.MACOS_SIGNING_IDENTITY || '-' }}
          APPLE_NOTARY_PROFILE: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.sign_macos) && 'ativ-notary' || '' }}
          FFMPEG_BIN: ${{ github.workspace }}/ATIV/build/ffmpeg-macos-${{ matrix.arch }}/ffmpeg
          FFPROBE_BIN: ${{ github.workspace }}/ATIV/build/ffmpeg-macos-${{ matrix.arch }}/ffprobe
        run: ./script/package_macos.sh "${{ matrix.arch }}"
      - name: Validate packaged application and startup
        run: |
          label="${{ matrix.arch }}"; [[ "$label" != x86_64 ]] || label=intel
          python3 script/validate_package.py "build/package-macos-${{ matrix.arch }}/ATIV.app" "macos-$label"
          ATIV_SMOKE_REPORT="$RUNNER_TEMP/ativ-smoke.json" open -n "build/package-macos-${{ matrix.arch }}/ATIV.app" --env ATIV_SMOKE_REPORT="$RUNNER_TEMP/ativ-smoke.json"
          for attempt in {1..30}; do [[ ! -s "$RUNNER_TEMP/ativ-smoke.json" ]] || break; sleep 1; done
          test -s "$RUNNER_TEMP/ativ-smoke.json"
          pkill -x ATIV || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ATIV-macos-${{ matrix.arch }}
          path: ATIV/packages/*
          if-no-files-found: error

  windows:
    defaults:
      run:
        working-directory: ATIV
    name: Windows ${{ matrix.arch }}
    needs: engine
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            fetch_arch: x86_64
            runner: windows-2025
          - arch: ARM64
            fetch_arch: aarch64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ATIV
      - name: Check out the tested canonical media core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tlolabs/avid-core
          ref: 0cce6ba838827d0bed540efc98731e74a1014456
          persist-credentials: false
          path: AVID Core
      - name: Configure build identity
        shell: bash
        run: |
          base="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$ATIV_CHANNEL" == stable ]]; then
            test "$GITHUB_REF_NAME" = "v$base"
            echo "ATIV_VERSION=$base" >> "$GITHUB_ENV"
            echo "ATIV_RELEASE=1" >> "$GITHUB_ENV"
          else
            echo "ATIV_VERSION=$base-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi
      - name: Fetch verified FFmpeg 9.0.1
        shell: bash
        run: ./script/fetch_ffmpeg.sh windows "${{ matrix.fetch_arch }}" "build/ffmpeg-windows-${{ matrix.arch }}"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --yes --no-progress
      - name: Verify canonical media and host contract with release tools
        shell: bash
        run: |
          export PATH="$PWD/build/ffmpeg-windows-${{ matrix.arch }}:$PATH"
          cargo test --locked --all-targets
          cargo test --manifest-path "../AVID Core/Cargo.toml" --locked --all-targets
          cargo test --manifest-path "../AVID Core/Cargo.toml" --locked --test ffmpeg -- --ignored
          ./script/test_engine_integration.sh
      - name: Build and package native application
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ startsWith(github.ref, 'refs/tags/') && secrets.WINDOWS_CERTIFICATE_BASE64 || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: ./script/package_windows.ps1 -Architecture "${{ matrix.arch }}" -FfmpegDirectory "build/ffmpeg-windows-${{ matrix.arch }}"
      - name: Native integration and installer smoke tests
        shell: pwsh
        run: ./script/test_windows_native.ps1 -Architecture "${{ matrix.arch }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ATIV-windows-${{ matrix.arch }}
          path: ATIV/packages/*
          if-no-files-found: error

  linux:
    defaults:
      run:
        working-directory: ATIV
    name: Linux ${{ matrix.arch }}
    needs: engine
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ATIV
      - name: Check out the tested canonical media core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tlolabs/avid-core
          ref: 0cce6ba838827d0bed540efc98731e74a1014456
          persist-credentials: false
          path: AVID Core
      - name: Configure build identity
        shell: bash
        run: |
          base="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$ATIV_CHANNEL" == stable ]]; then
            test "$GITHUB_REF_NAME" = "v$base"
            echo "ATIV_VERSION=$base" >> "$GITHUB_ENV"
            echo "ATIV_RELEASE=1" >> "$GITHUB_ENV"
          else
            echo "ATIV_VERSION=$base-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi
      - name: Install native toolkit
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libjson-glib-dev meson ninja-build xz-utils patchelf file desktop-file-utils libgdk-pixbuf2.0-bin librsvg2-common xvfb dbus-x11 squashfs-tools libfuse2t64
      - name: Fetch verified FFmpeg 9.0.1
        run: ./script/fetch_ffmpeg.sh linux "${{ matrix.arch }}" "build/ffmpeg-linux-${{ matrix.arch }}"
      - name: Verify canonical media and host contract with release tools
        shell: bash
        run: |
          export PATH="$PWD/build/ffmpeg-linux-${{ matrix.arch }}:$PATH"
          cargo test --locked --all-targets
          cargo test --manifest-path "../AVID Core/Cargo.toml" --locked --all-targets
          cargo test --manifest-path "../AVID Core/Cargo.toml" --locked --test ffmpeg -- --ignored
          ./script/test_engine_integration.sh
      - name: Build and package native application
        run: ./script/package_linux.sh "${{ matrix.arch }}" "build/ffmpeg-linux-${{ matrix.arch }}"
      - name: Native GTK and package smoke tests
        run: ./script/test_linux_native.sh "${{ matrix.arch }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ATIV-linux-${{ matrix.arch }}
          path: ATIV/packages/*

  release:
    name: Publish passing artifacts
    if: ${{ always() && !cancelled() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    needs: [engine, macos, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ATIV-*
          path: release-assets
          merge-multiple: true
      - name: Publish validated passing packages
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 script/publish_release.py
      - name: Generate and upload authenticated update feeds
        env:
          GH_TOKEN: ${{ github.token }}
          ATIV_UPDATE_PRIVATE_KEY: ${{ secrets.ATIV_UPDATE_PRIVATE_KEY }}
        run: |
          python3 -m venv build/release-tools
          build/release-tools/bin/pip install -r script/requirements-build.txt
          build/release-tools/bin/python script/release_metadata.py --assets release-assets --version "$ATIV_VERSION" --channel "$ATIV_CHANNEL" --tag "$ATIV_RELEASE_TAG"
          gh release upload "$ATIV_RELEASE_TAG" release-assets/latest.json release-assets/SHA256SUMS --clobber
          find release-assets -name 'appcast-*.xml' -exec gh release upload "$ATIV_RELEASE_TAG" '{}' --clobber \;
      - name: Report partial failures
        if: always()
        env:
          BUILD_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json,os; jobs=json.loads(os.environ["BUILD_RESULTS"]); failed=[k for k,v in jobs.items() if v["result"]!="success"]; print("Incomplete targets: " + ", ".join(failed)); raise SystemExit(bool(failed))'
