name: Native build, test, and package

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform group to qualify
        type: choice
        options: [all, macos, windows, linux]
        default: all
      stable_macos:
        description: Compatibility input; manual builds use the application version without requiring signing
        type: boolean
        default: false
      owner_testing:
        description: Build packages for owner testing without application acceptance prerequisites
        type: boolean
        default: true
      qualify_core_candidate:
        description: Use the exact authenticated candidate for unpublished host qualification
        type: boolean
        default: false
      clean_ffmpeg:
        description: Reserved compatibility input; Core artifacts are acquired, never rebuilt
        type: boolean
        default: false
      sign_macos:
        description: Sign and notarize macOS validation artifacts (does not publish a release)
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: native-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read
  attestations: read

env:
  ATIV_BUILD_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.owner_testing && '1' || '0' }}
  GH_TOKEN: ${{ github.token }}
  AVID_CORE_QUALIFICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.qualify_core_candidate && '1' || '0' }}
  CARGO_TERM_COLOR: always
  ATIV_CHANNEL: ${{ ((startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) || github.event_name == 'workflow_dispatch') && 'stable' || 'development' }}
  ATIV_UPDATE_PUBLIC_KEY: ${{ vars.ATIV_UPDATE_PUBLIC_KEY }}
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  engine:
    defaults:
      run:
        working-directory: ATIV
    name: Shared Rust engine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ATIV
          fetch-depth: 0
      - name: Verify stable release authorization
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
        env:
          ATIV_RELEASE_SIGNING_PUBLIC_KEY_B64: ${{ vars.ATIV_RELEASE_SIGNING_PUBLIC_KEY_B64 }}
          ATIV_RELEASE_SIGNING_FINGERPRINT: ${{ vars.ATIV_RELEASE_SIGNING_FINGERPRINT }}
        run: bash script/verify_release_tag.sh
      - name: Configure build identity
        shell: bash
        run: |
          base="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$ATIV_CHANNEL" == stable ]]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "v$base"; fi
            echo "ATIV_VERSION=$base" >> "$GITHUB_ENV"
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "ATIV_RELEASE=1" >> "$GITHUB_ENV"; fi
          else
            echo "ATIV_VERSION=$base-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi
      - name: Validate release infrastructure
        run: |
          python3 -m venv build/release-tools
          build/release-tools/bin/pip install -r script/requirements-build.txt
          build/release-tools/bin/python -m unittest discover -s script -p 'test_*.py'
          python3 script/check_updater_snapshot.py
          python3 script/dependency_inventory.py --check
      - name: Verify contributor DCO sign-offs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 script/check_dco.py "$BASE_SHA" "$HEAD_SHA"
      - name: Validate Rust workspace
        run: |
          rustup component add rustfmt clippy
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --workspace --locked --all-targets
      - name: Enforce ATIV runtime ownership
        run: |
          python3 script/test_runtime_ownership.py
          python3 -m unittest discover -s script -p test_application_release.py -v

  macos:
    if: github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'macos')
    defaults:
      run:
        working-directory: ATIV
    name: macOS ${{ matrix.arch }}
    needs: engine
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runtime_arch: arm64
            runner: macos-15
          - arch: x86_64
            runtime_arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ATIV
      - name: Configure build identity
        shell: bash
        run: |
          base="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$ATIV_CHANNEL" == stable ]]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "v$base"; fi
            echo "ATIV_VERSION=$base" >> "$GITHUB_ENV"
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "ATIV_RELEASE=1" >> "$GITHUB_ENV"; fi
          else
            echo "ATIV_VERSION=$base-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi
      - name: Acquire the exact authenticated Core runtime
        uses: ./ATIV/.github/actions/ffmpeg
        with:
          target: macos-${{ matrix.runtime_arch }}
          clean: ${{ inputs.clean_ffmpeg || false }}
      - name: Configure release signing and notarization
        if: (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) || inputs.sign_macos
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          : "${CERTIFICATE_BASE64:?Missing MACOS_CERTIFICATE_BASE64}"
          : "${CERTIFICATE_PASSWORD:?Missing MACOS_CERTIFICATE_PASSWORD}"
          : "${NOTARY_APPLE_ID:?Missing MACOS_NOTARY_APPLE_ID}"
          : "${NOTARY_PASSWORD:?Missing MACOS_NOTARY_PASSWORD}"
          : "${NOTARY_TEAM_ID:?Missing MACOS_NOTARY_TEAM_ID}"
          : "${SIGNING_IDENTITY:?Missing MACOS_SIGNING_IDENTITY}"
          KEYCHAIN="${RUNNER_TEMP}/ativ-signing.keychain-db"
          CERTIFICATE="${RUNNER_TEMP}/ativ-signing.p12"
          printf '%s' "${CERTIFICATE_BASE64}" | base64 -D > "${CERTIFICATE}"
          security create-keychain -p "${CERTIFICATE_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${CERTIFICATE_PASSWORD}" "${KEYCHAIN}"
          security import "${CERTIFICATE}" -P "${CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${CERTIFICATE_PASSWORD}" "${KEYCHAIN}"
          security list-keychains -d user -s "${KEYCHAIN}"
          xcrun notarytool store-credentials ativ-notary --apple-id "${NOTARY_APPLE_ID}" --team-id "${NOTARY_TEAM_ID}" --password "${NOTARY_PASSWORD}"
      - name: Verify ATIV tests and packaged media contract
        if: ${{ !inputs.owner_testing }}
        shell: bash
        run: |
          rustup component add clippy
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --all-targets
          ./script/test_engine_integration.sh macos-${{ matrix.runtime_arch }}
      - name: Build and package native application
        env:
          APPLE_SIGN_IDENTITY: ${{ ((startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) || inputs.sign_macos) && secrets.MACOS_SIGNING_IDENTITY || '-' }}
          APPLE_NOTARY_PROFILE: ${{ ((startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) || inputs.sign_macos) && 'ativ-notary' || '' }}
        run: ./script/package_macos.sh "${{ matrix.arch }}"
      - name: Native process integration tests
        if: ${{ !inputs.owner_testing }}
        run: |
          python3 script/create_smoke_media.py build/native-fixtures
          ATIV_TEST_MEDIA="$PWD/build/native-fixtures" ATIV_ENGINE_PATH="$PWD/build/package-macos-${{ matrix.arch }}/ATIV.app/Contents/MacOS/ativ-engine" swift test --package-path platform/macos --scratch-path build/native-tests
      - name: Validate packaged application and startup
        if: ${{ !inputs.owner_testing }}
        run: |
          label="${{ matrix.arch }}"; [[ "$label" != x86_64 ]] || label=intel
          python3 script/validate_package.py "build/package-macos-${{ matrix.arch }}/ATIV.app" "macos-$label"
          ATIV_SMOKE_REPORT="$RUNNER_TEMP/ativ-smoke.json" open -n "build/package-macos-${{ matrix.arch }}/ATIV.app" --env ATIV_SMOKE_REPORT="$RUNNER_TEMP/ativ-smoke.json"
          for _ in {1..30}; do [[ ! -s "$RUNNER_TEMP/ativ-smoke.json" ]] || break; sleep 1; done
          test -s "$RUNNER_TEMP/ativ-smoke.json"
          pkill -x ATIV || true
      - name: Record exact native host evidence
        if: ${{ !inputs.owner_testing }}
        run: |
          label="${{ matrix.arch }}"; [[ "$label" != x86_64 ]] || label=intel
          python3 script/host_evidence.py --application ativ --target "macos-${{ matrix.arch }}" --pin runtime/core-runtime.json --binary "build/package-macos-${{ matrix.arch }}/ATIV.app/Contents/MacOS" --metadata "build/package-macos-${{ matrix.arch }}/ATIV.app/Contents/Resources/FFmpeg" --packages packages/*.zip --output "packages/host-macos-${{ matrix.arch }}.json"
      - name: Attest stable macOS packages
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ATIV/packages/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ATIV-macos-${{ matrix.arch }}
          path: ATIV/packages/*
          if-no-files-found: error
          retention-days: 30

  windows:
    if: github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'windows')
    defaults:
      run:
        working-directory: ATIV
    name: Windows ${{ matrix.arch }}
    needs: engine
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runtime_arch: x86_64
            runner: windows-2025
          - arch: ARM64
            runtime_arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ATIV
      - name: Configure build identity
        shell: bash
        run: |
          base="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$ATIV_CHANNEL" == stable ]]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "v$base"; fi
            echo "ATIV_VERSION=$base" >> "$GITHUB_ENV"
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "ATIV_RELEASE=1" >> "$GITHUB_ENV"; fi
          else
            echo "ATIV_VERSION=$base-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi
      - name: Acquire the exact authenticated Core runtime
        uses: ./ATIV/.github/actions/ffmpeg
        with:
          target: windows-${{ matrix.runtime_arch }}
          clean: ${{ inputs.clean_ffmpeg || false }}
      - name: Verify ATIV tests and packaged media contract
        if: ${{ !inputs.owner_testing }}
        shell: bash
        run: |
          rustup component add clippy
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --all-targets
          ./script/test_engine_integration.sh windows-${{ matrix.runtime_arch }}
      - name: Build and package native application
        shell: pwsh
        run: ./script/package_windows.ps1 -Architecture "${{ matrix.arch }}"
      - name: Native integration and extracted portable ZIP smoke tests
        if: ${{ !inputs.owner_testing }}
        shell: pwsh
        run: ./script/test_windows_native.ps1 -Architecture "${{ matrix.arch }}"
      - name: Record exact native host evidence
        if: ${{ !inputs.owner_testing }}
        shell: pwsh
        run: |
          $packages = (Get-ChildItem packages -Filter '*.zip').FullName
          python script/host_evidence.py --application ativ --target 'windows-${{ matrix.runtime_arch }}' --pin runtime/core-runtime.json --binary 'build/windows-${{ matrix.arch }}/publish' --metadata 'build/windows-${{ matrix.arch }}/publish/ffmpeg-runtime' --packages $packages --output 'packages/host-windows-${{ matrix.runtime_arch }}.json'
      - name: Attest stable Windows packages
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ATIV/packages/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ATIV-windows-${{ matrix.arch }}
          path: ATIV/packages/*
          if-no-files-found: error
          retention-days: 30

  linux:
    if: github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'linux')
    defaults:
      run:
        working-directory: ATIV
    name: Linux ${{ matrix.arch }}
    needs: engine
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runtime_arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runtime_arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ATIV
      - name: Configure build identity
        shell: bash
        run: |
          base="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$ATIV_CHANNEL" == stable ]]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "v$base"; fi
            echo "ATIV_VERSION=$base" >> "$GITHUB_ENV"
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "ATIV_RELEASE=1" >> "$GITHUB_ENV"; fi
          else
            echo "ATIV_VERSION=$base-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi
      - name: Install native toolkit
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libjson-glib-dev meson ninja-build xz-utils patchelf file desktop-file-utils libgdk-pixbuf2.0-bin librsvg2-common xvfb dbus-x11 squashfs-tools libfuse2t64
      - name: Acquire the exact authenticated Core runtime
        uses: ./ATIV/.github/actions/ffmpeg
        with:
          target: linux-${{ matrix.runtime_arch }}
          clean: ${{ inputs.clean_ffmpeg || false }}
      - name: Verify ATIV tests and packaged media contract
        if: ${{ !inputs.owner_testing }}
        shell: bash
        run: |
          rustup component add clippy
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --all-targets
          ./script/test_engine_integration.sh linux-${{ matrix.runtime_arch }}
      - name: Build and package native application
        run: ./script/package_linux.sh "${{ matrix.arch }}"
      - name: Native GTK and package smoke tests
        if: ${{ !inputs.owner_testing }}
        run: ./script/test_linux_native.sh "${{ matrix.arch }}"
      - name: Record exact native host evidence
        if: ${{ !inputs.owner_testing }}
        run: |
          python3 script/host_evidence.py --application ativ --target "linux-${{ matrix.runtime_arch }}" --pin runtime/core-runtime.json --binary "build/ATIV-${{ matrix.arch }}.AppDir/usr/lib/ativ" --metadata "build/ATIV-${{ matrix.arch }}.AppDir/usr/lib/ativ/ffmpeg-runtime" --packages packages/*.AppImage --output "packages/host-linux-${{ matrix.runtime_arch }}.json"
      - name: Attest stable Linux packages
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ATIV/packages/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ATIV-linux-${{ matrix.arch }}
          path: ATIV/packages/*
          retention-days: 30
