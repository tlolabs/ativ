name: Recipe 7 host qualification (no publication)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform to validate (normal pushes and tags always build all)
        type: choice
        options: [all, macos, windows, linux]
        default: all
      sign_macos:
        description: Sign and notarize macOS validation artifacts (does not publish a release)
        type: boolean
        default: false
  push:
    branches: [codex/recipe7-host-qualification]

concurrency:
  group: recipe7-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read
  attestations: read

env:
  GH_TOKEN: ${{ github.token }}
  CARGO_TERM_COLOR: always
  ATIV_CHANNEL: development
  ATIV_QUALIFICATION_R7: '1'
  ATIV_UPDATE_PUBLIC_KEY: ${{ vars.ATIV_UPDATE_PUBLIC_KEY }}
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  engine:
    defaults:
      run:
        working-directory: ATIV
    name: Shared Rust engine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ATIV
      - name: Check out the tested canonical media core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tlolabs/avid-core
          ref: fab2ed86bb64582d3f7a7dd736c713cc3951550b
          persist-credentials: false
          path: AVID Core
      - name: Configure build identity
        shell: bash
        run: |
          base="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$ATIV_CHANNEL" == stable ]]; then
            test "$GITHUB_REF_NAME" = "v$base"
            echo "ATIV_VERSION=$base" >> "$GITHUB_ENV"
            echo "ATIV_RELEASE=1" >> "$GITHUB_ENV"
          else
            echo "ATIV_VERSION=$base-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi
      - name: Validate release infrastructure
        run: |
          python3 -m venv build/release-tools
          build/release-tools/bin/pip install -r script/requirements-build.txt
          build/release-tools/bin/python script/test_release_infrastructure.py
      - name: Validate Rust workspace
        run: |
          rustup component add rustfmt clippy
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --workspace --locked --all-targets
      - name: Enforce Core runtime ownership
        run: |
          python3 script/test_runtime_ownership.py
          python3 script/test_recipe7_qualification.py

  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos'
    defaults:
      run:
        working-directory: ATIV
    name: macOS ${{ matrix.arch }}
    needs: engine
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            core_arch: arm64
            runner: macos-15
          - arch: x86_64
            core_arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ATIV
      - name: Check out the tested canonical media core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tlolabs/avid-core
          ref: fab2ed86bb64582d3f7a7dd736c713cc3951550b
          persist-credentials: false
          path: AVID Core
      - name: Configure build identity
        shell: bash
        run: |
          base="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$ATIV_CHANNEL" == stable ]]; then
            test "$GITHUB_REF_NAME" = "v$base"
            echo "ATIV_VERSION=$base" >> "$GITHUB_ENV"
            echo "ATIV_RELEASE=1" >> "$GITHUB_ENV"
          else
            echo "ATIV_VERSION=$base-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi
      - name: Acquire exact retained Recipe 7 candidate
        id: acquisition
        run: |
          runtime="$(python3 script/core_runtime.py provision macos-${{ matrix.core_arch }})"
          echo "$runtime" >> "$GITHUB_PATH"
          echo "AVID_RUNTIME_DIRECTORY=$runtime" >> "$GITHUB_ENV"
      - name: Configure release signing and notarization
        if: startsWith(github.ref, 'refs/tags/') || inputs.sign_macos
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          : "${CERTIFICATE_BASE64:?Missing MACOS_CERTIFICATE_BASE64}"
          : "${CERTIFICATE_PASSWORD:?Missing MACOS_CERTIFICATE_PASSWORD}"
          : "${NOTARY_APPLE_ID:?Missing MACOS_NOTARY_APPLE_ID}"
          : "${NOTARY_PASSWORD:?Missing MACOS_NOTARY_PASSWORD}"
          : "${NOTARY_TEAM_ID:?Missing MACOS_NOTARY_TEAM_ID}"
          : "${SIGNING_IDENTITY:?Missing MACOS_SIGNING_IDENTITY}"
          KEYCHAIN="${RUNNER_TEMP}/ativ-signing.keychain-db"
          CERTIFICATE="${RUNNER_TEMP}/ativ-signing.p12"
          printf '%s' "${CERTIFICATE_BASE64}" | base64 -D > "${CERTIFICATE}"
          security create-keychain -p "${CERTIFICATE_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${CERTIFICATE_PASSWORD}" "${KEYCHAIN}"
          security import "${CERTIFICATE}" -P "${CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${CERTIFICATE_PASSWORD}" "${KEYCHAIN}"
          security list-keychains -d user -s "${KEYCHAIN}"
          xcrun notarytool store-credentials ativ-notary --apple-id "${NOTARY_APPLE_ID}" --team-id "${NOTARY_TEAM_ID}" --password "${NOTARY_PASSWORD}"
      - name: Verify canonical media and host contract with release tools
        id: media
        shell: bash
        run: |
          cargo test --locked --all-targets
          # Serialize fixture creation in the shared harness to avoid Linux ETXTBSY.
          # Explicit concurrent-render tests still launch and verify their own threads.
          cargo test --manifest-path "../AVID Core/Cargo.toml" --locked --all-targets -- --test-threads=1
          cargo test --manifest-path "../AVID Core/Cargo.toml" --locked --test ffmpeg -- --ignored
          cargo test --manifest-path "../AVID Core/Cargo.toml" --locked --test runtime_contract -- --ignored --test-threads=1
          ./script/test_engine_integration.sh macos-${{ matrix.core_arch }}
      - name: Build and package native application
        id: packaging
        env:
          APPLE_SIGN_IDENTITY: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.sign_macos) && secrets.MACOS_SIGNING_IDENTITY || '-' }}
          APPLE_NOTARY_PROFILE: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.sign_macos) && 'ativ-notary' || '' }}
        run: ./script/package_macos.sh "${{ matrix.arch }}"
      - name: Native process integration tests
        id: native_tests
        run: |
          python3 script/create_smoke_media.py build/native-fixtures
          ATIV_TEST_MEDIA="$PWD/build/native-fixtures" ATIV_ENGINE_PATH="$PWD/build/package-macos-${{ matrix.arch }}/ATIV.app/Contents/MacOS/ativ-engine" swift test --package-path platform/macos --scratch-path build/native-tests
      - name: Validate packaged application and startup
        id: launch
        run: |
          label="${{ matrix.arch }}"; [[ "$label" != x86_64 ]] || label=intel
          python3 script/validate_package.py "build/package-macos-${{ matrix.arch }}/ATIV.app" "macos-$label"
          ATIV_SMOKE_REPORT="$RUNNER_TEMP/ativ-smoke.json" open -n "build/package-macos-${{ matrix.arch }}/ATIV.app" --env ATIV_SMOKE_REPORT="$RUNNER_TEMP/ativ-smoke.json"
          for attempt in {1..30}; do [[ ! -s "$RUNNER_TEMP/ativ-smoke.json" ]] || break; sleep 1; done
          test -s "$RUNNER_TEMP/ativ-smoke.json"
          pkill -x ATIV || true
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: R7-candidate-macos-${{ matrix.arch }}
          path: ATIV/packages/*
          if-no-files-found: error

      - name: Install from DMG and validate installed runtime and launch
        id: installed_package
        run: bash script/qualify_macos_install.sh "${{ matrix.arch }}"
      - name: Authenticate candidate package update signatures offline
        id: update_signatures
        if: ${{ !cancelled() && steps.packaging.outcome == 'success' }}
        shell: bash
        env:
          ATIV_UPDATE_PRIVATE_KEY: ${{ secrets.ATIV_UPDATE_PRIVATE_KEY }}
        run: |
          python3 -m venv build/signature-tools
          if [[ -f build/signature-tools/Scripts/python.exe ]]; then py=build/signature-tools/Scripts/python.exe; else py=build/signature-tools/bin/python; fi
          "$py" -m pip install -r script/requirements-build.txt
          "$py" script/qualify_update_signatures.py
      - name: Record exact candidate and partial qualification evidence
        if: always()
        shell: bash
        env:
          QUALIFICATION_STEPS: ${{ toJSON(steps) }}
        run: python3 script/recipe7_evidence.py macos-${{ matrix.core_arch }}
      - name: Retain qualification evidence even when a gate fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: R7-evidence-macos-${{ matrix.core_arch }}
          path: |
            ATIV/build/qualification-evidence/*
            ATIV/build/*smoke*.json
            ATIV/build/*smoke*.log
            ATIV/build/recipe7/*/acquisition-evidence.json
          if-no-files-found: error
      - name: Enforce outstanding application release gates
        if: always()
        shell: bash
        run: |
          echo 'host_packaging remains incomplete: signing setup, authenticated application upgrades and manual UI/accessibility evidence are not complete.'
          exit 1

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows'
    defaults:
      run:
        working-directory: ATIV
    name: Windows ${{ matrix.arch }}
    needs: engine
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            core_arch: x86_64
            runner: windows-2025
          - arch: ARM64
            core_arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ATIV
      - name: Check out the tested canonical media core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tlolabs/avid-core
          ref: fab2ed86bb64582d3f7a7dd736c713cc3951550b
          persist-credentials: false
          path: AVID Core
      - name: Configure build identity
        shell: bash
        run: |
          base="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$ATIV_CHANNEL" == stable ]]; then
            test "$GITHUB_REF_NAME" = "v$base"
            echo "ATIV_VERSION=$base" >> "$GITHUB_ENV"
            echo "ATIV_RELEASE=1" >> "$GITHUB_ENV"
          else
            echo "ATIV_VERSION=$base-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi
      - name: Acquire exact retained Recipe 7 candidate
        id: acquisition
        shell: bash
        run: |
          runtime="$(python3 script/core_runtime.py provision windows-${{ matrix.core_arch }})"
          echo "$runtime" >> "$GITHUB_PATH"
          echo "AVID_RUNTIME_DIRECTORY=$runtime" >> "$GITHUB_ENV"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --yes --no-progress
      - name: Verify canonical media and host contract with release tools
        id: media
        shell: bash
        run: |
          cargo test --locked --all-targets
          # Serialize fixture creation in the shared harness to avoid Linux ETXTBSY.
          # Explicit concurrent-render tests still launch and verify their own threads.
          cargo test --manifest-path "../AVID Core/Cargo.toml" --locked --all-targets -- --test-threads=1
          cargo test --manifest-path "../AVID Core/Cargo.toml" --locked --test ffmpeg -- --ignored
          cargo test --manifest-path "../AVID Core/Cargo.toml" --locked --test runtime_contract -- --ignored --test-threads=1
          ./script/test_engine_integration.sh windows-${{ matrix.core_arch }}
      - name: Build and package native application
        id: packaging
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ startsWith(github.ref, 'refs/tags/') && secrets.WINDOWS_CERTIFICATE_BASE64 || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: ./script/package_windows.ps1 -Architecture "${{ matrix.arch }}"
      - name: Native integration and installer smoke tests
        id: installation_launch
        shell: pwsh
        run: ./script/test_windows_native.ps1 -Architecture "${{ matrix.arch }}"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: R7-candidate-windows-${{ matrix.arch }}
          path: ATIV/packages/*
          if-no-files-found: error

      - name: Authenticate candidate package update signatures offline
        id: update_signatures
        if: ${{ !cancelled() && steps.packaging.outcome == 'success' }}
        shell: bash
        env:
          ATIV_UPDATE_PRIVATE_KEY: ${{ secrets.ATIV_UPDATE_PRIVATE_KEY }}
        run: |
          export ATIV_QUALIFICATION_CONFIG="$PWD/build/windows-${{ matrix.arch }}/publish/update-config.json"
          cargo test --locked -p ativ-update qualifies_real_candidate_package_signatures -- --ignored
      - name: Record exact candidate and partial qualification evidence
        if: always()
        shell: bash
        env:
          QUALIFICATION_STEPS: ${{ toJSON(steps) }}
        run: python3 script/recipe7_evidence.py windows-${{ matrix.core_arch }}
      - name: Retain qualification evidence even when a gate fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: R7-evidence-windows-${{ matrix.core_arch }}
          path: |
            ATIV/build/qualification-evidence/*
            ATIV/build/*smoke*.json
            ATIV/build/*smoke*.log
            ATIV/build/recipe7/*/acquisition-evidence.json
          if-no-files-found: error
      - name: Enforce outstanding application release gates
        if: always()
        shell: bash
        run: |
          echo 'host_packaging remains incomplete: signing setup, authenticated application upgrades and manual UI/accessibility evidence are not complete.'
          exit 1

  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux'
    defaults:
      run:
        working-directory: ATIV
    name: Linux ${{ matrix.arch }}
    needs: engine
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            core_arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            core_arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ATIV
      - name: Check out the tested canonical media core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tlolabs/avid-core
          ref: fab2ed86bb64582d3f7a7dd736c713cc3951550b
          persist-credentials: false
          path: AVID Core
      - name: Configure build identity
        shell: bash
        run: |
          base="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$ATIV_CHANNEL" == stable ]]; then
            test "$GITHUB_REF_NAME" = "v$base"
            echo "ATIV_VERSION=$base" >> "$GITHUB_ENV"
            echo "ATIV_RELEASE=1" >> "$GITHUB_ENV"
          else
            echo "ATIV_VERSION=$base-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi
      - name: Install native toolkit
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libjson-glib-dev meson ninja-build xz-utils patchelf file desktop-file-utils libgdk-pixbuf2.0-bin librsvg2-common xvfb dbus-x11 squashfs-tools libfuse2t64
      - name: Acquire exact retained Recipe 7 candidate
        id: acquisition
        run: |
          runtime="$(python3 script/core_runtime.py provision linux-${{ matrix.core_arch }})"
          echo "$runtime" >> "$GITHUB_PATH"
          echo "AVID_RUNTIME_DIRECTORY=$runtime" >> "$GITHUB_ENV"
      - name: Verify canonical media and host contract with release tools
        id: media
        shell: bash
        run: |
          cargo test --locked --all-targets
          # Serialize fixture creation in the shared harness to avoid Linux ETXTBSY.
          # Explicit concurrent-render tests still launch and verify their own threads.
          cargo test --manifest-path "../AVID Core/Cargo.toml" --locked --all-targets -- --test-threads=1
          cargo test --manifest-path "../AVID Core/Cargo.toml" --locked --test ffmpeg -- --ignored
          cargo test --manifest-path "../AVID Core/Cargo.toml" --locked --test runtime_contract -- --ignored --test-threads=1
          ./script/test_engine_integration.sh linux-${{ matrix.core_arch }}
      - name: Build and package native application
        id: packaging
        run: ./script/package_linux.sh "${{ matrix.arch }}"
      - name: Native GTK and package smoke tests
        id: installation_launch
        run: ./script/test_linux_native.sh "${{ matrix.arch }}"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: R7-candidate-linux-${{ matrix.arch }}
          path: ATIV/packages/*

      - name: Authenticate candidate package update signatures offline
        id: update_signatures
        if: ${{ !cancelled() && steps.packaging.outcome == 'success' }}
        shell: bash
        env:
          ATIV_UPDATE_PRIVATE_KEY: ${{ secrets.ATIV_UPDATE_PRIVATE_KEY }}
        run: |
          python3 -m venv build/signature-tools
          if [[ -f build/signature-tools/Scripts/python.exe ]]; then py=build/signature-tools/Scripts/python.exe; else py=build/signature-tools/bin/python; fi
          "$py" -m pip install -r script/requirements-build.txt
          "$py" script/qualify_update_signatures.py
      - name: Record exact candidate and partial qualification evidence
        if: always()
        shell: bash
        env:
          QUALIFICATION_STEPS: ${{ toJSON(steps) }}
        run: python3 script/recipe7_evidence.py linux-${{ matrix.core_arch }}
      - name: Retain qualification evidence even when a gate fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: R7-evidence-linux-${{ matrix.core_arch }}
          path: |
            ATIV/build/qualification-evidence/*
            ATIV/build/*smoke*.json
            ATIV/build/*smoke*.log
            ATIV/build/recipe7/*/acquisition-evidence.json
          if-no-files-found: error
      - name: Enforce outstanding application release gates
        if: always()
        shell: bash
        run: |
          echo 'host_packaging remains incomplete: signing setup, authenticated application upgrades and manual UI/accessibility evidence are not complete.'
          exit 1
