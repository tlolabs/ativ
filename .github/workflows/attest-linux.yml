name: Attest and verify native Linux AppImages
on:
  workflow_dispatch:
    inputs:
      native_run:
        description: Same-commit native Linux qualification run
        type: string
        required: true
permissions:
  contents: read
jobs:
  attest:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Authenticate exact native AppImage inputs
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.native_run }}
        run: python3 script/acquire_app_artifact.py --run "$SOURCE_RUN" --workflow .github/workflows/native-release.yml --platform linux --output unsigned --allow-partial
      - name: Stage exact native AppImage bytes
        run: |
          set -euo pipefail
          mkdir attested-packages
          mapfile -d '' images < <(find unsigned -type f -name '*.AppImage' -print0)
          test "${#images[@]}" -ge 1
          test "${#images[@]}" -le 2
          for image in "${images[@]}"; do
            cp "$image" attested-packages/
          done
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: attested-packages/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: attested-linux-appimages
          path: attested-packages/*
          if-no-files-found: error
  verify-native:
    name: Verify attested Linux ${{ matrix.target }}
    needs: attest
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
            label: x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            label: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: attested-linux-appimages
          path: attested-packages
      - name: Verify final provenance before native execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          images=(attested-packages/*-linux-${{ matrix.label }}.AppImage)
          test "${#images[@]}" = 1
          gh attestation verify "${images[0]}" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/attest-linux.yml" --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" --deny-self-hosted-runners >/dev/null
          chmod +x "${images[0]}"
          mkdir final-native
          image="$(realpath "${images[0]}")"
          (cd final-native && "$image" --appimage-extract)
          python3 script/ffmpeg_runtime.py validate '${{ matrix.target }}' --binary final-native/squashfs-root/usr/lib/ativ --metadata final-native/squashfs-root/usr/lib/ativ/ffmpeg-runtime
