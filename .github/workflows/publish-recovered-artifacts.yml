name: Publish independently verified native platforms

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_run:
    workflows: [Native build, test, and package]
    types: [requested, completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: First-party native push run to publish or recover
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: native-publisher-${{ github.event.workflow_run.head_sha || inputs.source_run_id || github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == 'tlolabs/ativ')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: read
      contents: write
      attestations: read
    steps:
      - name: Check out publisher from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Publish each native target after its own verification
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          WAIT_MINUTES: ${{ (github.event_name == 'push' || github.event.action == 'requested') && '150' || '5' }}
        run: |
          if [[ "${{ github.event_name }}" == push ]]; then
            python3 script/publish_native_platforms.py --source-sha "$SOURCE_SHA" --source-branch "$SOURCE_BRANCH" --wait-minutes "$WAIT_MINUTES"
          else
            python3 script/publish_native_platforms.py --run-id "$SOURCE_RUN_ID" --wait-minutes "$WAIT_MINUTES"
          fi
