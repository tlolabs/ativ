name: Build Packages

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            python: "3.10"
          - os: windows-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.14"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Install desktop and media dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-tk xvfb

      - name: Run test suite
        if: runner.os != 'Linux'
        run: python -m unittest discover -s tests -v

      - name: Run test suite (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install -r requirements-build.txt
          brew install ffmpeg

      - name: Run test suite
        run: |
          source .venv/bin/activate
          python -m unittest discover -s tests -v

      - name: Configure Developer ID signing and notarization
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          : "${MACOS_CERTIFICATE_BASE64:?Missing MACOS_CERTIFICATE_BASE64 secret}"
          : "${MACOS_CERTIFICATE_PASSWORD:?Missing MACOS_CERTIFICATE_PASSWORD secret}"
          : "${MACOS_NOTARY_APPLE_ID:?Missing MACOS_NOTARY_APPLE_ID secret}"
          : "${MACOS_NOTARY_PASSWORD:?Missing MACOS_NOTARY_PASSWORD secret}"
          : "${MACOS_NOTARY_TEAM_ID:?Missing MACOS_NOTARY_TEAM_ID secret}"
          : "${MACOS_SIGNING_IDENTITY:?Missing MACOS_SIGNING_IDENTITY secret}"
          KEYCHAIN_PATH="${RUNNER_TEMP}/avid-signing.keychain-db"
          CERTIFICATE_PATH="${RUNNER_TEMP}/avid-signing.p12"
          printf '%s' "${MACOS_CERTIFICATE_BASE64}" | base64 -D > "${CERTIFICATE_PATH}"
          security create-keychain -p "${MACOS_CERTIFICATE_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${MACOS_CERTIFICATE_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" -P "${MACOS_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${MACOS_CERTIFICATE_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"
          xcrun notarytool store-credentials avid-notary \
            --apple-id "${MACOS_NOTARY_APPLE_ID}" \
            --team-id "${MACOS_NOTARY_TEAM_ID}" \
            --password "${MACOS_NOTARY_PASSWORD}"

      - name: Build macOS package
        env:
          AVID_REQUIRE_SIGNED_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
          MACOS_NOTARY_PROFILE: ${{ startsWith(github.ref, 'refs/tags/') && 'avid-notary' || '' }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: ./build_macos_app.sh "${{ matrix.arch }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AVID-macos-${{ matrix.arch }}
          path: packages/AVID-macos-${{ matrix.arch }}.dmg

  windows:
    name: Windows x64
    runs-on: windows-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          choco install ffmpeg -y

      - name: Run test suite
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -m unittest discover -s tests -v

      - name: Build Windows package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force packages | Out-Null
          $ffmpegTools = Join-Path $env:ChocolateyInstall "lib\ffmpeg\tools"
          $ffmpeg = (Get-ChildItem $ffmpegTools -Filter ffmpeg.exe -File -Recurse | Select-Object -First 1).FullName
          $ffprobe = (Get-ChildItem $ffmpegTools -Filter ffprobe.exe -File -Recurse | Select-Object -First 1).FullName
          if (-not $ffmpeg -or -not $ffprobe) {
            throw "Could not locate the installed FFmpeg binaries under $ffmpegTools"
          }
          pyinstaller --noconfirm --windowed --name AVID --add-data "LICENSE;." --add-binary "${ffmpeg};." --add-binary "${ffprobe};." avid_gui.py
          Compress-Archive -Path dist\AVID -DestinationPath packages\AVID-windows-x64.zip -Force

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AVID-windows-x64
          path: packages/AVID-windows-x64.zip

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    env:
      FFMPEG_STATIC_VERSION: "7.0.2"
      FFMPEG_STATIC_SHA256: abda8d77ce8309141f83ab8edf0596834087c52467f6badf376a6a2a4c87cf67

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-tk xvfb xz-utils
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run test suite
        run: xvfb-run -a python -m unittest discover -s tests -v

      - name: Build Linux package
        run: |
          mkdir -p packages
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 --silent --show-error \
            "https://johnvansickle.com/ffmpeg/releases/ffmpeg-${FFMPEG_STATIC_VERSION}-amd64-static.tar.xz" \
            --output ffmpeg-static.tar.xz
          printf '%s  %s\n' "${FFMPEG_STATIC_SHA256}" ffmpeg-static.tar.xz | sha256sum --check --strict
          mkdir -p ffmpeg-static
          tar -xJf ffmpeg-static.tar.xz --strip-components=1 -C ffmpeg-static
          test -x ffmpeg-static/ffmpeg
          test -x ffmpeg-static/ffprobe
          ffmpeg-static/ffmpeg -version
          ffmpeg-static/ffprobe -version
          pyinstaller --noconfirm --name AVID --add-data "LICENSE:." --add-binary "ffmpeg-static/ffmpeg:." --add-binary "ffmpeg-static/ffprobe:." avid_gui.py
          tar -C dist -czf packages/AVID-linux-x64.tar.gz AVID

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AVID-linux-x64
          path: packages/AVID-linux-x64.tar.gz

  release:
    name: Publish Release
    needs:
      - macos
      - windows
      - linux
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "A.V.I.D. release ${GITHUB_REF_NAME}" \
            --latest
