name: Build Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-13

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install -r requirements.txt pyinstaller
          brew install ffmpeg

      - name: Build macOS package
        run: ./build_macos_app.sh "${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: AVID-macos-${{ matrix.arch }}
          path: packages/AVID-macos-${{ matrix.arch }}.dmg

  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          choco install ffmpeg -y

      - name: Build Windows package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force packages | Out-Null
          $ffmpegTools = Join-Path $env:ChocolateyInstall "lib\ffmpeg\tools"
          $ffmpeg = (Get-ChildItem $ffmpegTools -Filter ffmpeg.exe -File -Recurse | Select-Object -First 1).FullName
          $ffprobe = (Get-ChildItem $ffmpegTools -Filter ffprobe.exe -File -Recurse | Select-Object -First 1).FullName
          if (-not $ffmpeg -or -not $ffprobe) {
            throw "Could not locate the installed FFmpeg binaries under $ffmpegTools"
          }
          pyinstaller --noconfirm --windowed --name AVID --add-data "LICENSE;." --add-binary "${ffmpeg};." --add-binary "${ffprobe};." avid_gui.py
          Compress-Archive -Path dist\AVID -DestinationPath packages\AVID-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: AVID-windows-x64
          path: packages/AVID-windows-x64.zip

  linux:
    name: Linux x64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xz-utils
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build Linux package
        run: |
          mkdir -p packages
          curl --fail --location --silent --show-error \
            https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
            --output ffmpeg-static.tar.xz
          mkdir -p ffmpeg-static
          tar -xJf ffmpeg-static.tar.xz --strip-components=1 -C ffmpeg-static
          test -x ffmpeg-static/ffmpeg
          test -x ffmpeg-static/ffprobe
          pyinstaller --noconfirm --name AVID --add-data "LICENSE:." --add-binary "ffmpeg-static/ffmpeg:." --add-binary "ffmpeg-static/ffprobe:." avid_gui.py
          tar -C dist -czf packages/AVID-linux-x64.tar.gz AVID

      - uses: actions/upload-artifact@v4
        with:
          name: AVID-linux-x64
          path: packages/AVID-linux-x64.tar.gz

  release:
    name: Publish Release
    needs:
      - macos
      - windows
      - linux
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "A.V.I.D. release ${GITHUB_REF_NAME}" \
            --latest
