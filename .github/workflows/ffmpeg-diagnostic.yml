name: FFmpeg Windows source diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ATIV
          persist-credentials: false
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: CLANG64
          update: true
          install: make diffutils pkgconf python gnupg
          pacboy: clang:p llvm:p lld:p pkgconf:p gdb:p
      - name: Build the exact source recipe and retain unstripped executable
        shell: msys2 {0}
        working-directory: ATIV
        run: /usr/bin/python3 script/ffmpeg_build.py build windows-x86_64 --clean
      - name: Capture native crash backtrace
        shell: msys2 {0}
        working-directory: ATIV
        run: |
          export ATIV_FFMPEG_RUNTIME="$PWD/build/ffmpeg/windows-x86_64"
          /usr/bin/python3 script/diagnose_ffmpeg_windows.py --backtrace
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ffmpeg-windows-backtrace
          path: |
            ATIV/build/ffmpeg-windows-diagnostic.json
            ATIV/build/ffmpeg-windows-backtrace.log
            ATIV/build/ffmpeg-work/windows-x86_64/build.log
