name: Publish qualified application packages
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: application-promotion-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      attestations: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test shared stable updater
        run: |
          python3 script/check_updater_snapshot.py
          cargo test --locked -p tlo-updater -p ativ-update
      - name: Require all applicable final-package release gates
        run: python3 script/application_release.py --output release-assets
      - name: Verify annotated stable tag and version
        if: startsWith(github.ref, 'refs/tags/')
        run: bash script/verify_release_tag.sh
      - name: Generate signed updates for exact qualified staged packages
        env:
          ATIV_UPDATE_PRIVATE_KEY: ${{ secrets.ATIV_UPDATE_PRIVATE_KEY }}
          ATIV_UPDATE_PUBLIC_KEY: ${{ vars.ATIV_UPDATE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          python3 -m venv build/release-tools
          build/release-tools/bin/pip install -r script/requirements-build.txt
          python3 script/dependency_inventory.py --check
          python3 script/dependency_inventory.py --sbom-dir release-assets
          build/release-tools/bin/python -m unittest discover -s script -p 'test_*.py'
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
          build/release-tools/bin/python script/release_metadata.py --assets release-assets --version "$VERSION" --channel stable --tag "v$VERSION"
          build/release-tools/bin/python script/tlo_update_release.py --verify --assets release-assets
          build/release-tools/bin/python script/qualify_updates.py --assets release-assets
      - name: Attest package promotion identity
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: release-assets/*
      - name: Create new release, verify actual downloads, then publish
        env:
          ATIV_UPDATE_PUBLIC_KEY: ${{ vars.ATIV_UPDATE_PUBLIC_KEY }}
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'Release already exists; refusing asset replacement or tag movement.' >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" --notes-file docs/release-integration.md
          gh release upload "$GITHUB_REF_NAME" release-assets/*
          gh release download "$GITHUB_REF_NAME" --dir verified-downloads
          (cd verified-downloads && sha256sum --check SHA256SUMS)
          for asset in verified-downloads/*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/application-release.yml" --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" --deny-self-hosted-runners >/dev/null
          done
          build/release-tools/bin/python script/tlo_update_release.py --verify --assets verified-downloads
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest=true
          # Probe the same public, unauthenticated static URL installed clients use.
          # A failure fails qualification; never mutate a published tag or its bytes.
          build/release-tools/bin/python script/qualify_updates.py --assets verified-downloads --published
