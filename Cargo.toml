[workspace]
members = [
    "crates/ativ-core",
    "crates/ativ-engine",
    "crates/ativ-update",
]
resolver = "2"

[workspace.package]
version = "0.2.9"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/tlolabs/ativ"
homepage = "https://github.com/tlolabs/ativ"
authors = ["Thomas Lothian"]
description = "A TLO Labs open-source project for turning artwork and audio into video."
rust-version = "1.88"

[workspace.dependencies]
avid-core = { git = "https://github.com/tlolabs/avid-core.git", rev = "8e27a86ec106028d93130de35a35c0eeda7a9ce3", version = "=0.3.3" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
